apiVersion: v1 
kind: Service
metadata:
  name: mongodb-service
  labels:
    project: roboshop
    component: mongodb
    tier: db
  namespace: roboshop
spec:
  clusterIP: None
  selector:
    project: roboshop
    component: mongodb
    tier: db
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017     
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop 
  labels:
    project: roboshop
    component: mongodb
    tier: db 
spec:
  replicas: 1
  serviceName: mongodb-service
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
  template:
    metadata:
      project: roboshop
      component: mongodb
      tier: db
    spec:
      containers:
      - name: mongodb
        image: shanmukhatadisetti/mongodb:v1
    